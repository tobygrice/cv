# .github/workflows/publish-resume.yml
name: Build and publish resume

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile LaTeX
        uses: xu-cheng/latex-action@v3
        with:
          root_file: main.tex

      - name: Rename PDF
        run: mv main.pdf Tobias_Grice_CV.pdf

      - name: Delete existing rolling release if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest >/dev/null 2>&1 && gh release delete latest --yes || true

      - name: Delete existing rolling tag if present
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push origin :refs/tags/latest || true

      - name: Create fresh rolling release at current commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create latest Tobias_Grice_CV.pdf \
            --target "${GITHUB_SHA}" \
            --title "Tobias Grice CV" \
            --notes "Automatically updated from commit ${GITHUB_SHA}" \
            --latest
